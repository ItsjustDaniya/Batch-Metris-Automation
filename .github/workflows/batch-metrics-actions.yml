
name: Run Batch Metrics Automation

on:
  schedule:
    - cron: '30 5 * * *'   # 11:00 AM IST
    - cron: '30 11 * * *'  # 5:00 PM IST
  workflow_dispatch:

concurrency:
  group: batch-metrics-pipeline
  cancel-in-progress: false

jobs:
  run-batch-metrics:
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Execute automation
      - name: Run Batch Metrics Automation
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          BATCH_METRICS_SHEET_KEY: ${{ secrets.BATCH_METRICS_SHEET_KEY }}

        run: |
          echo "=============================="
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Current branch: $GITHUB_REF"
          echo "Repository path: $GITHUB_WORKSPACE"
          echo "=============================="

          python --version

          echo "Starting Batch Metrics Automation..."
          python Batch_Metrics_Automation.py

          echo "Batch Metrics Automation completed successfully."
